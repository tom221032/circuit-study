<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1" id="themeColor">
<title>电路 · 邱关源第六版 学习站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<script>
  // 先套主题/字号，避免刷新时闪一下白
  try {
    var st = JSON.parse(localStorage.getItem('circuit-study-v1') || '{}');
    if (st.theme) document.documentElement.dataset.theme = st.theme;
    if (st.fs) document.documentElement.style.setProperty('--fs', st.fs);
  } catch (e) {}
</script>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/">
      <span class="brand-icon">⚡</span>
      <span>
        <b>电路</b>
        <small>邱关源 · 第六版</small>
      </span>
    </a>

    <div class="side-search">
      <input id="sideSearch" type="search" placeholder="搜索笔记 / 字幕 / 题目…" autocomplete="off">
    </div>

    <nav class="chapter-nav" id="chapterNav"></nav>

    <div class="side-foot">
      <div class="progress-mini">
        <div class="pm-label"><span>总进度</span><b id="pmText">0%</b></div>
        <div class="pm-bar"><i id="pmBar"></i></div>
      </div>
      <a class="side-link" href="#/search">全站搜索</a>
      <a class="side-link" href="books/notes.pdf" target="_blank" rel="noopener">原书 PDF</a>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="菜单">☰</button>
      <div class="crumbs" id="crumbs"></div>
      <div class="top-actions">
        <input id="topSearch" class="top-search" type="search" placeholder="搜索…" autocomplete="off">
        <a class="btn ghost only-desk" href="#/search" title="全站搜索">🔍</a>
        <button class="icon-btn" id="btnEdit" title="编辑原文（调试）" aria-label="编辑原文" aria-pressed="false">✎</button>
        <button class="icon-btn" id="btnTheme" title="浅色 / 暗色" aria-label="切换主题">◐</button>
        <span class="fs-ctl" role="group" aria-label="字号">
          <button class="icon-btn fs-btn" id="btnFsDown" title="缩小字号">A−</button>
          <button class="icon-btn fs-btn" id="btnFsUp" title="放大字号">A+</button>
        </span>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="editbar" id="editBar" hidden>
  <span class="eb-tag">编辑原文</span>
  <button class="btn ghost eb-btn" id="edUndo" title="撤销（Ctrl+Z）">↶ 撤销 <b id="edUndoN">0</b>/15</button>
  <button class="btn ghost eb-btn" id="edRedo" title="恢复（Ctrl+Shift+Z）">↷ 恢复 <b id="edRedoN">0</b>/15</button>
  <button class="btn ghost eb-btn eb-reset" id="edReset" title="丢掉所有修改，回到原始文本">复原全部</button>
  <button class="btn ghost eb-btn" id="edExit" title="退出编辑（Esc）">完成</button>
</div>
<div class="lightbox" id="lightbox" hidden><img alt="笔记图片"><button class="lb-close" aria-label="关闭">✕</button></div>
<div class="toast" id="toast"></div>
<script src="vendor/katex/katex.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
